<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecallAI | Practice</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="dashboard-page">
    <header class="dashboard-header">
        <div class="logo"><div class="logo-mark">R</div><div><h2>RecallAI</h2><span>Memory training</span></div></div>
        <div class="header-actions">
            <a class="text-link" href="/">Chat</a>
            <a class="text-link" href="/dashboard">Progress</a>
            <a class="text-link" href="/journal">Journal</a>
        </div>
        <div class="header-actions">
    <select id="languageSelect" aria-label="Select language" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="kn">ಕನ್ನಡ</option>
    </select>
    <button class="theme-toggle" onclick="toggleTheme()">☾ / ☀</button>
</div>
    </header>
    <main class="dashboard-container">
        <div class="dashboard-title">
            <span class="eyebrow">PRACTICE MODE</span>
            <h1>Memory challenge</h1>
            <p>Focus on the information, then recall it from memory.</p>
        </div>
        <section id="challengeSection" class="challenge-section">
            <div class="challenge-header">
                <div><span class="eyebrow">YOUR ACTIVITY</span><h2 id="challengeTitle">Your Challenge</h2></div>
                <span id="difficultyBadge" class="difficulty-badge">Level 1</span>
            </div>
            <div id="challengeContent" class="challenge-card">
                <p>Loading your challenge...</p>
            </div>
        </section>
        <button class="secondary-button" onclick="window.location.href='/'">Back to chat</button>
    </main>
</div>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
    window.addEventListener("load", () => {
        startChallenge();
    });
</script>
</body>
</html>
